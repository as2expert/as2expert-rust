name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (blocking feature)
        run: cargo clippy --all-targets --features blocking -- -D warnings
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (blocking feature)
        run: cargo test --all-targets --features blocking
      - name: Doc tests
        run: cargo test --doc
      - name: Build (native-tls)
        run: cargo build --no-default-features --features native-tls
